####################################################################################
# Vendor-annotated Klipper config (FLY / BTT / Voron-kit house style).
#
# Every section header AND every value carries a trailing comment, and the
# comments are non-ASCII. This shape broke the parser twice over: a header
# like "[printer]   # note" does not END with ']', so the section was never
# registered and its keys vanished; and a value like "180   # note" reached
# the validator with the comment still attached and failed as "not a number".
# Klipper itself reads this fine -- it parses with
# configparser(inline_comment_prefixes=(';', '#')).
####################################################################################

[include mainsail.cfg]        # included file

[mcu]                           # board id
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_0000-if00

# FLY-D5 Mini
[printer]                       # machine settings
kinematics: corexy               # motion system
max_velocity: 400               # top speed
max_accel: 7500                 # top acceleration
max_z_velocity: 15              # z speed
max_z_accel: 100                # z acceleration
square_corner_velocity: 5.0     # corner speed

[stepper_x]
position_min: 0                     # soft limit low
position_max: 180                   # travel (250mm-300mm-350mm)

[stepper_y]
position_min: 0
position_max: 180

[stepper_z]
position_max: 180             # travel (240mm-290mm-340mm)
position_min: -5              # nozzle-clean clearance needs about -5

[extruder]                          # hotend
nozzle_diameter: 0.400              # nozzle
filament_diameter: 1.750            # filament
max_temp: 280                       # hotend max
max_extrude_cross_section: 5        # extrusion area cap

[heater_bed]                 # bed
max_temp: 120                # bed max

[gcode_macro PRINT_START]          # start macro, no temperature params
gcode:
    G92 E0                         # reset extruder
    G28                            # home all
    G1 Z20 F3000                   # raise gantry

[gcode_macro PRINT_END]            # end macro
gcode:
    M104 S0                        # hotend off
    M140 S0                        # bed off
