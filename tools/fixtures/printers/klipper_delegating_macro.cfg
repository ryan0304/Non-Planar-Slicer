# Real-world report fixture: a PRINT_START macro that takes no EXTRUDER/BED
# params, so the importer inlines its body verbatim (see
# printer_import._parse_klipper_cfg). That body resets the extruder, homes,
# calls the user's OWN custom sub-macro (PRINT_HUAXIAN), and lifts Z -- and
# never heats anything and never sets M83. The user had to hand-edit in
# M140/M190/M104/M109/M83 themselves before this printed at all: Klipper
# refuses to extrude below min_extrude_temp (default 170C), so a block like
# this is not a risky print, it is a guaranteed abort on the first
# extrusion move.
#
# Uses '#' inline comments (Klipper/configparser syntax) throughout, exactly
# like the FLY/BTT-style vendor configs this importer already had to learn to
# read -- this is the counter-example for the auto-repair-at-import feature.

[stepper_x]
position_min: 0                # soft limit low
position_max: 235              # bed width

[stepper_y]
position_min: 0
position_max: 235

[stepper_z]
position_min: -2               # nozzle-clean clearance
position_max: 250              # gantry travel

[extruder]
nozzle_diameter: 0.400         # nozzle
filament_diameter: 1.750       # filament
max_temp: 300                  # hotend max

[heater_bed]
max_temp: 120                  # bed max

[printer]
kinematics: corexy
max_velocity: 300              # top speed
max_accel: 5000                # top acceleration
max_z_velocity: 10             # z speed
max_z_accel: 200               # z acceleration

[gcode_macro PRINT_HUAXIAN]
gcode:
    M117 Printing               # the user's own sub-macro; it does not heat either

[gcode_macro PRINT_START]       # no EXTRUDER/BED params -- inlined verbatim
gcode:
    G92 E0                       # reset extruder
    G28                           # home all
    PRINT_HUAXIAN                  # the user's own sub-macro call
    G1 Z20 F3000                    # raise gantry

[gcode_macro PRINT_END]
gcode:
    M104 S0                     # hotend off
    M140 S0                     # bed off
