# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Deploying this makes the generator a PUBLIC, UNAUTHENTICATED service.
# Anyone with the URL can import a printer config and generate G-code. The
# per-session printer store keeps one visitor's imported printers away from
# another's, but that is isolation, not access control -- there is no login
# and this blueprint does not add one. That now extends to hybrid planar-
# base requests too (see below): any visitor can trigger a real OrcaSlicer
# subprocess on the server, not just the parametric/non-planar generator.
#
# Read tools/../README before pointing anyone at the result: every ceiling
# this project ships was measured on one Voron Trident, and G-code it emits
# for a stranger's machine is unverified by anyone.

services:
  - type: web
    name: non-planar-slicer
    runtime: docker
    plan: free
    # Nearest Render region to Malaysia/SEA. Others: oregon, ohio, virginia,
    # frankfurt. Changing this after the first deploy recreates the service.
    region: singapore

    # Docker runtime (not the native `runtime: python` this blueprint used
    # before) because hybrid planar-base mode needs a real OrcaSlicer CLI
    # binary alongside the app -- Render's native Python runtime has no way
    # to install one. See ./Dockerfile for what that actually bundles and
    # why, and tools/orca_render_feasibility/ for the probe that checked
    # this fits Render's free-tier 512 MB RAM / 0.1 vCPU caps BEFORE this
    # file was changed to use them, rather than assuming it would.
    #
    # No buildCommand/startCommand: the Dockerfile's own CMD replaces
    # startCommand, and there is no separate build step to name for a
    # Docker service (the whole Dockerfile IS the build).
    dockerfilePath: ./Dockerfile

    # Render pings this to decide the deploy succeeded. "/" would serve a
    # directory listing of the repo, which is a 200 but not evidence the app
    # actually works; the viewer page is.
    healthCheckPath: /viewer/index.html

    envVars:
      # The one setting that makes this deployable. serve.py binds loopback
      # unless told otherwise, so without this the health check never
      # connects and the deploy fails -- which is the intended default: a
      # local run should never be exposed by forgetting a flag.
      - key: TRIDENT_BIND
        value: 0.0.0.0

      # Hosting-resource ceilings for hybrid planar-base requests (see
      # serve.py's _hybrid_complexity_limits docstring for the full
      # reasoning: this is a request-budget concern, not a machine-safety
      # one, so it is opt-in per deployment rather than a code default).
      #
      # FIRST-PASS NUMBERS, not derived from a formula -- tools/
      # orca_render_feasibility/'s probe measured exactly ONE real hybrid
      # request (a star with 3 overlapping Zone Overrides, the production
      # points_per_turn=240, 37680 total wall points) completing in 65.1s
      # under these same caps; these ceilings give roughly 1.6x/3x headroom
      # above that one measured point and above the one real mesh tested
      # (2728 triangles), not a validated worst case. Watch Render's actual
      # request logs after this deploy and tighten (or loosen) both once
      # real traffic gives more than one data point each.
      - key: TRIDENT_MAX_HYBRID_WALL_POINTS
        value: "60000"
      - key: TRIDENT_MAX_HYBRID_MESH_TRIANGLES
        value: "8000"

    # PORT is injected by Render at runtime and read by serve.py's
    # _bind_config(); it is deliberately NOT set here.
    #
    # PYTHON_VERSION (the previous native-runtime pin, 3.11.9) has no
    # equivalent on a Docker service -- ./Dockerfile's own FROM line and
    # Ubuntu 24.04's bundled python3 (3.12) are what fixes the interpreter
    # now, so there is nothing for Render itself to pin here.
