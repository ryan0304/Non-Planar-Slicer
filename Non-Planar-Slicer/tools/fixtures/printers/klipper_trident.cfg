# Realistic (trimmed) printer.cfg fixture for the custom-printer import tests.
[stepper_x]
step_pin: PC0
dir_pin: PC1
enable_pin: !PC2
microsteps: 16
rotation_distance: 40
endstop_pin: probe:z_virtual_endstop
position_min: 0
position_max: 235
homing_speed: 60

[stepper_y]
step_pin: PC3
dir_pin: PC4
enable_pin: !PC5
microsteps: 16
rotation_distance: 40
endstop_pin: probe:z_virtual_endstop
position_min: 0
position_max: 235
homing_speed: 60

[stepper_z]
step_pin: PC6
dir_pin: PC7
enable_pin: !PC8
microsteps: 16
rotation_distance: 8
position_min: -8
position_max: 160

[extruder]
step_pin: PD0
dir_pin: PD1
enable_pin: !PD2
microsteps: 16
rotation_distance: 22.6789511
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_cross_section: 5
heater_pin: PD3
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 26.213
pid_Ki: 1.304
pid_Kd: 131.721
min_temp: 0
max_temp: 300

[heater_bed]
heater_pin: PD4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 120

# Voron Trident
[printer]
kinematics: corexy
max_velocity: 400
max_accel: 8000
max_z_velocity: 25
max_z_accel: 500

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 208, 185
probe_count: 5, 5

[probe]
pin: ^PB0
x_offset: 3.0
y_offset: 29.0
z_offset: 3.8
speed: 5.0
samples: 2

[gcode_macro PRINT_START]
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(210)|float %}
    {% set BED_TEMP = params.BED|default(60)|float %}
    M140 S{BED_TEMP}
    G28
    G29
    M190 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}
    G92 E0

[gcode_macro PRINT_END]
gcode:
    TURN_OFF_HEATERS
    G91
    G1 Z5 F600
    G90
    M84
