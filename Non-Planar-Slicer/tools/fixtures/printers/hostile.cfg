# Adversarial fixture for the custom-printer import safety tests.
# Every numeric value here is deliberately out of range or nonsensical, and
# the start macro is deliberately dangerous. None of this should ever reach
# a real printer -- printer_validate must clamp/strip/error every bit of it.
#
# The macro body's '#' lines are the counter-example for the '#'-comment
# rule. '#' is a comment in printer.cfg but not in a G-code file, so all of
# them are rewritten to ';'. Without that rewrite:
#   * "#PRINT_START ..." is read as a CALL to the start macro (the check takes
#     the line's first token and searches it for PRINT_START, and '#PRINT_START'
#     contains it), which suppresses the missing-G28 error and the missing-
#     temperature warning -- clearing a config that never homes at all.
#   * "#M502" is scanned with a command head of literally '#M502', which is in
#     no blocked-token set, so it rides through the stripper as an executable
#     line and wipes the printer's EEPROM.
#   * "#M109 S200" is the counter-example for auto-repair-at-import
#     (printer_validate._repair_missing_heating): read as a command it would
#     satisfy the "has a temperature command" check and suppress repair
#     entirely, leaving this macro's real abort-on-first-extrusion bug
#     unfixed. Read correctly as a comment, repair still fires and inserts
#     REAL M140/M190/M104/M109 commands elsewhere in the block.
# Delete the rewrite and this fixture goes quiet, which is what it exists to catch.
[stepper_x]
position_min: 0
position_max: 99999

[stepper_y]
position_min: 0
position_max: 235

[stepper_z]
position_min: -5
position_max: 160

[extruder]
nozzle_diameter: -0.4
filament_diameter: 1.75
max_temp: 500

[heater_bed]
max_temp: 120

[printer]
kinematics: corexy
max_velocity: 5
max_accel: 8000
max_z_velocity: 9999
max_z_accel: 500

[gcode_macro PRINT_START]
gcode:
    M502
    M851 Z-3.7
    M303 E0 S240 C8
    ; a stray unresolved placeholder: {unknown_placeholder}
    #PRINT_START is called by the slicer, honest
    #M502
    #M109 S200                  a fake heating command hidden in a comment
    G1 Z5 F600                  # lift before the first travel
    M83
    G92 E0
