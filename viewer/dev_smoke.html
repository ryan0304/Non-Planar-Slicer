<!DOCTYPE html>
<!--
  dev_smoke.html — DEV-ONLY visual-smoke harness. NOT part of the app.

  Loads index.html in a fullscreen iframe, fetches a .gcode file (same-origin,
  via serve.py) and feeds it into the running viewer through the existing
  window.loadGcode(name, text) hook. Used to screenshot the viewer in a
  "gcode loaded" state (model + slim timeline + telemetry card) for manual
  or headless-Chrome visual verification. Query param:

    ?file=<path relative to viewer/dev_smoke.html>   default: ../examples/01b_probe_safe_vase.gcode
    ?selftest=1   run the viewer assertions instead (see below): measure tool,
                  machine-limit fallbacks, and the printer/world coordinate
                  mirror (measure readout, nav cube, shape cage)

  Usage:  python serve.py   then open
          http://localhost:8777/viewer/dev_smoke.html
          http://localhost:8777/viewer/dev_smoke.html?selftest=1
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>dev smoke — Trident viewer</title>
<style>
  html,body { margin:0; height:100%; background:#0b0e13; }
  iframe { display:block; width:100%; height:100%; border:none; }
  #smoke-status { position:fixed; top:4px; left:4px; z-index:9999; font:11px monospace;
    color:#8b97a7; background:rgba(0,0,0,.5); padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<div id="smoke-status">loading iframe...</div>
<iframe id="viewer-frame" src="index.html"></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const file = params.get('file') || '../examples/01b_probe_safe_vase.gcode';
  const status = document.getElementById('smoke-status');
  const frame = document.getElementById('viewer-frame');

  // ---- measure-tool assertions ---------------------------------------------
  // Checked against a model whose real dimensions are known from its own
  // G-code: 01_gentle_wave_vase.gcode starts extruding at X149.5 Y117.5 on a
  // 235 mm bed, so its centreline radius at the base is exactly 32.0 mm and
  // its diameter 64.0 mm -- which is also what the viewer reports as the
  // footprint.
  //
  // The infill case is here because it is the one that was actually wrong. The
  // first cut of the diameter search took the point nearest the direction
  // opposite the pick, and the vase's solid base has toolpath at every radius
  // from the centre out, so it returned an infill line near the middle and
  // reported 36.0 mm across a part that is 64.0 mm across. Anything that goes
  // back to a nearest-point search will fail assertion 3 or 4.
  async function runSelfTest(w) {
    const results = [];
    const check = (name, ok, detail) => results.push({ name, ok, detail });
    const near = (a, b, tol) => Math.abs(a - b) <= tol;

    w.document.querySelector('.measure-mode[data-mmode="ring"]').click();

    const base = w.__measureAt(149.5, 117.5, 0.35).ring;
    check('base radius is 32.0 mm', near(base.radius, 32.0, 0.05), 'got ' + base.radius);
    check('base diameter spans the part, not its infill',
          base.diameter > 60, 'got ' + base.diameter);

    const wall = w.__measureAt(149.5, 117.5, 20).ring;
    check('hollow-wall diameter is 64.0 mm', near(wall.diameter, 64.0, 0.1),
          'got ' + wall.diameter);

    // A pick 10 mm from the axis, sitting in the solid base's infill. Its
    // radius is its own, but the diameter beside it is still the full part.
    const infill = w.__measureAt(127.5, 117.5, 0.35).ring;
    check('pick inside the infill still reports the full width',
          infill.diameter > 60 && near(infill.radius, 9.85, 0.6),
          'd ' + infill.diameter + ' r ' + infill.radius);

    // Far-side angle wrapped past 2*PI once and came back negative, which slid
    // under every "is this section closed" threshold unchallenged.
    const gaps = [0.35, 10, 20, 30, 45].map(z => w.__measureAt(149.5, 117.5, z).ring.gapDeg);
    check('angular gaps are never negative', gaps.every(g => g >= 0), 'got ' + gaps.join(', '));

    w.document.querySelector('.measure-mode[data-mmode="span"]').click();
    w.__measureAt(149.5, 117.5, 0.3);
    const pts = w.__measureAt(149.5, 117.5, 40.3).points;
    const dz = pts[1][2] - pts[0][2];
    check('vertical span reads its true height', near(dz, 39.9, 0.05), 'got ' + dz);

    // ---- machine-limit fallback -------------------------------------------
    // A printer declaring z_amp_max = 0 has ZERO non-planar tolerance. The
    // old `p.z_amp_max || 0.95` handed it the Trident's own measured 0.95mm
    // instead, because 0 is falsy -- so the amp curve editor advertised
    // 0.95mm of headroom on a machine with none, which on real hardware is a
    // probe strike. Anything that reintroduces a falsy-check here, or a
    // fallback naming another printer's number, fails these two.
    const zc = w.__zAmpCapFor;
    check('z_amp_max of 0 stays 0 (not another printer\'s ceiling)',
          typeof zc === 'function' && zc(0) === 0, 'got ' + (zc && zc(0)));
    check('absent z_amp_max falls back to the conservative 0.4, never 0.95',
          typeof zc === 'function' && zc(undefined) === 0.4 && zc(NaN) === 0.4 &&
          zc(Infinity) === 0.4 && zc(null) === 0.4,
          'got ' + (zc && [zc(undefined), zc(NaN), zc(Infinity), zc(null)].join('/')));

    // ---- the DRAFT's amplitude clamp tracks the printer too ------------------
    // preview_math.js carried its own hardcoded `AMP_MAX = 0.95` -- the
    // Trident's ceiling applied to every machine -- while the server clamps
    // amp_profile to the selected profile's z_amp_max (serve.py's
    // amp_ceiling). On a Bambu declaring 4.0 the draft therefore stopped
    // responding partway up the amp curve: dragging a point from 0.95 to 2.34
    // changed the request and the printed part, but not the picture the user
    // was judging it by, and it understated the real wave by more than half.
    // Understating is the dangerous direction -- the draft's entire job is to
    // show what the server will actually generate.
    const pAmp = w.__previewAmpMax;
    check('preview exposes its amplitude clamp for inspection',
          typeof pAmp === 'function', 'got ' + typeof pAmp);
    for (const [key, expected] of [['trident', 0.95], ['bambu_a1', 4.0],
                                   ['creality_ender3', 1.0]]) {
      w.__testSelectPrinter(key);
      check('draft amplitude clamp follows ' + key + ' (' + expected + '), not a hardcoded 0.95',
            pAmp() === expected, 'got ' + pAmp());
    }
    // Behavioural half of the guard: the clamp is only meaningful if the drawn
    // geometry actually grows with it. Same design, two printers -- the wave
    // must be visibly bigger on the machine that allows more dip. Asserting on
    // geometry rather than on the constant is what catches someone reinstating
    // a clamp somewhere else in the pipeline.
    function draftWave(printerKey, ampPeak) {
      w.__testSelectPrinter(printerKey);
      const d = w.__designSnapshot();
      d.amp_profile = [[0, ampPeak], [1, ampPeak]];
      d.z_waves = 5; d.radius = 32; d.height = 60;
      const p = w.generatePreview(d, { base_layers: 0, brim: 0, skirt: 0,
                                       base_style_applies: true });
      const n = p.length / 3, mid = Math.floor(n / 2);
      let mn = Infinity, mx = -Infinity;
      for (let i = mid; i < mid + 120 && i < n; i++) {
        const v = p[i * 3 + 1]; if (v < mn) mn = v; if (v > mx) mx = v;
      }
      return mx - mn;
    }
    const wideWave = draftWave('bambu_a1', 2.34);
    const narrowWave = draftWave('trident', 2.34);
    check('a 2.34mm amplitude draws a bigger draft wave on a 4.0mm machine than on a 0.95mm one',
          wideWave > narrowWave + 1.0,
          'bambu_a1 ' + wideWave.toFixed(2) + ' vs trident ' + narrowWave.toFixed(2));
    check('the 0.95mm machine still clamps its draft at its own ceiling',
          near(narrowWave, 1.99, 0.15), 'got ' + narrowWave.toFixed(2));

    // ---- loading a design re-applies the ceilings of the printer it names ---
    // "Load design as JSON" assigns every key the design object owns, and
    // `printer` is one of them -- so a load can switch machines. applyDesignToUI()
    // repainted the combo and the bed but never called applyPrinterCaps(), so
    // the amp editor's ceiling, its control points and the draft's amplitude
    // clamp all stayed on the PREVIOUS machine's numbers. Loading a 4.0mm
    // Bambu design onto a 0.95mm Trident then left the UI offering, drawing
    // and SENDING amplitudes the server would clamp away -- exactly what
    // applyPrinterCaps' own comment forbids.
    function loadDesignDoc(doc) {
      const dt = new w.DataTransfer();
      dt.items.add(new w.File([JSON.stringify(doc)], 'd.json', { type: 'application/json' }));
      const input = w.document.getElementById('load-design-file');
      input.files = dt.files;
      input.dispatchEvent(new w.Event('change', { bubbles: true }));
    }
    const steep = [[0, 0], [0.3, 2.34], [0.6, 3.5], [1, 1.0]];
    w.__testSelectPrinter('trident');
    loadDesignDoc(Object.assign({}, w.__designSnapshot(),
                                { printer: 'bambu_a1', amp_profile: steep }));
    await new Promise(function(res){ setTimeout(res, 600); });
    check('loading a 4.0mm design while on a 0.95mm printer raises every ceiling with it',
          w.__designSnapshot().printer === 'bambu_a1' &&
          w.__testAmpCeilings().hi === 4.0 && w.__previewAmpMax() === 4.0,
          'hi ' + w.__testAmpCeilings().hi + ', draft clamp ' + w.__previewAmpMax());

    loadDesignDoc(Object.assign({}, w.__designSnapshot(),
                                { printer: 'trident', amp_profile: steep }));
    await new Promise(function(res){ setTimeout(res, 600); });
    const sent = w.__designSnapshot().amp_profile;
    check('THE GUARD -- loading that design onto the 0.95mm printer clamps the points, ' +
          'so the panel never sends an amplitude the server would clamp away',
          w.__testAmpCeilings().hi === 0.95 && w.__previewAmpMax() === 0.95 &&
          sent.every(p => p[1] <= 0.95 + 1e-9),
          'sent ' + JSON.stringify(sent.map(p => +p[1].toFixed(2))));

    // ---- wave-slope ceiling comes from the printer, not a module constant ---
    // designer.js used to hardcode `var SLOPE_LIMIT = 0.25` and apply it to
    // every printer. It now reads PRINTER_SLOPE[design.printer] (fed from
    // each /api/printers entry's quality_slope_max) via activeSlopeLimit().
    // __testInjectPrinter/__testSelectPrinter/__testSetCurves (all test-only,
    // see designer.js) exercise that exact path without a network round trip.
    //
    // Pin the geometry first so the peak slope is a KNOWN number regardless
    // of whatever radius/waves/curve a previous session in this browser
    // profile may have left in localStorage: radius 32, 5 waves, the
    // shipped-default amp curve (peak 0.8mm) over a flat silhouette gives
    // peak slope = 0.8 * 5 / 32 = 0.125 -- inside a 0.25 ceiling, outside a
    // 0.10 one.
    const radiusEl = w.document.getElementById('d-radius');
    const wavesEl = w.document.getElementById('d-waves');
    const slopeReadEl = w.document.getElementById('slope-read');
    const ampHintEl = w.document.getElementById('amp-limit-hint');
    const loopNoteEl = w.document.getElementById('loop-zcap');
    const prevRadius = radiusEl.value;
    const prevWaves = wavesEl.value;
    const prevAmpProfile = w.__designSnapshot().amp_profile;
    const prevSilProfile = w.__designSnapshot().radius_profile;
    const prevPrinterKey = w.__designSnapshot().printer;

    radiusEl.value = '32';
    radiusEl.dispatchEvent(new w.Event('input'));
    radiusEl.dispatchEvent(new w.Event('change'));
    wavesEl.value = '5';
    wavesEl.dispatchEvent(new w.Event('input'));
    wavesEl.dispatchEvent(new w.Event('change'));
    w.__testSetCurves(
      [[0,0],[0.2,0.3],[0.4,0.6],[0.6,0.8],[0.8,0.8],[1.0,0.5]],
      [[0,1],[0.2,1],[0.4,1],[0.6,1],[0.8,1],[1.0,1]]
    );

    w.__testInjectPrinter({ key: '__test_slope_loose__', name: 'Test Loose Slope',
      bed: [235,235], z_amp_max: 4.0, quality_slope_max: 0.25, has_probe: false });
    w.__testInjectPrinter({ key: '__test_slope_tight__', name: 'Test Tight Slope',
      bed: [235,235], z_amp_max: 4.0, quality_slope_max: 0.10, has_probe: false });

    w.__testSelectPrinter('__test_slope_loose__');
    check('printer declaring quality_slope_max 0.25: peak slope 0.125 reads ok',
          /\/ 0\.25 {2}ok\s*$/.test(slopeReadEl.textContent),
          'got ' + JSON.stringify(slopeReadEl.textContent));

    w.__testSelectPrinter('__test_slope_tight__');
    check('THE GUARD -- same design, a printer declaring quality_slope_max 0.10, ' +
          'now reads TOO STEEP (this is what catches a re-hardcoded SLOPE_LIMIT)',
          /\/ 0\.10 {2}TOO STEEP/.test(slopeReadEl.textContent),
          'got ' + JSON.stringify(slopeReadEl.textContent));

    // ---- probe-less machines never claim a probe ----------------------------
    // Both false-attribution sites (amp-limit-hint, loop-zcap) must say
    // "z-amp ceiling", never "probe keep-out", for a printer that declares
    // has_probe:false -- regardless of how low its ceiling actually is.
    w.__testInjectPrinter({ key: '__test_probeless_lowcap__', name: 'Test Probeless Low-Cap',
      bed: [235,235], z_amp_max: 0.5, quality_slope_max: 0.25, has_probe: false });
    w.__testSelectPrinter('__test_probeless_lowcap__');
    check('has_probe:false: amp hint never says "probe keep-out"',
          ampHintEl.textContent.indexOf('probe keep-out') === -1,
          'got ' + JSON.stringify(ampHintEl.textContent));
    check('has_probe:false: loop-height note never says "probe keep-out"',
          loopNoteEl.textContent.indexOf('probe keep-out') === -1,
          'got ' + JSON.stringify(loopNoteEl.textContent));
    check('...and the amp hint still explains the low ceiling as "z-amp ceiling"',
          ampHintEl.textContent.indexOf('z-amp ceiling') !== -1,
          'got ' + JSON.stringify(ampHintEl.textContent));

    // Positive control: the SAME low ceiling, but has_probe:true, DOES say
    // probe keep-out. Without this, the three checks above could pass simply
    // because "probe keep-out" never appears for any printer any more --
    // this proves the string is still reachable when it is actually true.
    w.__testInjectPrinter({ key: '__test_probed_lowcap__', name: 'Test Probed Low-Cap',
      bed: [235,235], z_amp_max: 0.5, quality_slope_max: 0.25, has_probe: true });
    w.__testSelectPrinter('__test_probed_lowcap__');
    check('positive control: has_probe:true with the same low ceiling DOES say probe keep-out',
          ampHintEl.textContent.indexOf('probe keep-out') !== -1 &&
          loopNoteEl.textContent.indexOf('probe keep-out') !== -1,
          'amp hint ' + JSON.stringify(ampHintEl.textContent) +
            ', loop note ' + JSON.stringify(loopNoteEl.textContent));

    // ---- amp-editor two-ceiling model ----------------------------------------
    // The amp curve editor has TWO ceilings that used to be smashed into one
    // dashed line (see designer.js's makeEditor()/updateSlope()): a HARD wall
    // (z_amp_max, always the editor's axis top, control points physically
    // clamped to it) and a SEPARATE, advisory slope cap (print-quality only --
    // the server warns but still generates) that is drawn -- band, dashed
    // line, label -- only while it actually falls inside that wall. A single
    // line meant opposite things on different printers (a real wall on the
    // Trident, a wall-you-can-cross-with-a-warning on a Bambu) and its label
    // clipped off the canvas whenever it WAS the wall (py(hi)-2 sits above the
    // canvas edge). w.__testAmpCeilings() (designer.js) exposes both ceilings'
    // values, labels and DRAWN geometry -- canvas has no DOM to read back --
    // so these assertions catch both a value regression and a pixel one.
    const ampCv = w.document.getElementById('amp-curve');
    const ampW = ampCv.width, ampH = ampCv.height;
    // A rect fully inside the canvas is the clipping regression itself: the
    // old bug placed the "amp limit" label's top edge at py(hi)-2, i.e.
    // partly above y=0, which this catches directly rather than eyeballing a
    // screenshot.
    const rectOnCanvas = (r) => !!r &&
      r.x >= 0 && r.y >= 0 && r.x + r.w <= ampW && r.y + r.h <= ampH;

    // slope cap = quality_slope_max * radius * min(silhouette) / waves. At
    // radius 32 / 5 waves / flat silhouette / slope 0.25 that is 1.60mm --
    // below a 4.0mm z_amp_max (band shown), not below a 0.95mm one (no band,
    // hard wall only). Same slope math as the readout above (same injected
    // 0.25 printer, just a different z_amp_max), so the two can never
    // disagree about which one binds.
    w.__testInjectPrinter({ key: '__test_ref_wide__', name: 'Test Ref Wide',
      bed: [235,235], z_amp_max: 4.0, quality_slope_max: 0.25, has_probe: false });
    w.__testSelectPrinter('__test_ref_wide__');
    const ceilWide = w.__testAmpCeilings();
    check('wide printer (z_amp_max 4.0): hard wall is at hi and its label stays on-canvas',
          near(ceilWide.wall.val, 4.0, 0.01) && /^amp limit 4/.test(ceilWide.wall.label) &&
          rectOnCanvas(ceilWide.wall.rect),
          'got ' + JSON.stringify(ceilWide.wall));
    // bandTop must sit at the editor's fixed top padding (PADT=8 in
    // designer.js's makeEditor()) -- py(hi) always resolves there by
    // definition, which is the whole "hard wall is always the axis top"
    // invariant this rework is built on, made assertable rather than just
    // asserted-by-construction.
    check('wide printer: slope cap (1.60) binds inside the wall -- band shown, on-canvas label',
          !!ceilWide.soft && near(ceilWide.soft.val, 1.60, 0.01) &&
          /^slope cap 1\.60/.test(ceilWide.soft.label) &&
          near(ceilWide.soft.bandTop, 8, 0.01) &&
          ceilWide.soft.bandTop < ceilWide.soft.bandBottom &&   // band has positive height
          rectOnCanvas(ceilWide.soft.rect),
          'got ' + JSON.stringify(ceilWide.soft));
    // THE GUARD -- dragging (here: setting) a point ABOVE the slope cap must
    // NOT get clamped to it. Only z_amp_max (hi) may clamp a control point;
    // the slope cap is advisory. 2.34 is the exact number from the bug
    // report this rework fixes: on a 4.0mm-ceiling printer the old single
    // line drew the 1.60 slope cap and points sailed past it to 2.34 with no
    // clamping -- confirm that stays true under the new model too.
    w.__testSetCurves([[0,0],[0.2,0.3],[0.4,0.6],[0.6,2.34],[0.8,0.8],[1.0,0.5]], null);
    const overCapProfile = w.__designSnapshot().amp_profile;
    const overCapPt = overCapProfile.find(p => Math.abs(p[1] - 2.34) < 1e-6);
    check('a control point above the slope cap is never clamped to it',
          !!overCapPt, 'got amp_profile ' + JSON.stringify(overCapProfile));
    check('...and the slope readout flags it red (over), not silently accepted',
          slopeReadEl.classList.contains('err') && /TOO STEEP/.test(slopeReadEl.textContent),
          'got ' + JSON.stringify(slopeReadEl.textContent) + ' classes ' + slopeReadEl.className);
    // Restore the pinned default curve before the narrow-printer checks below
    // read amp_profile again.
    w.__testSetCurves([[0,0],[0.2,0.3],[0.4,0.6],[0.6,0.8],[0.8,0.8],[1.0,0.5]], null);

    w.__testInjectPrinter({ key: '__test_ref_narrow__', name: 'Test Ref Narrow',
      bed: [235,235], z_amp_max: 0.95, quality_slope_max: 0.25, has_probe: false });
    w.__testSelectPrinter('__test_ref_narrow__');
    const ceilNarrow = w.__testAmpCeilings();
    check('narrow printer (z_amp_max 0.95): hard wall label stays on-canvas ' +
          '(THE CLIPPING REGRESSION -- the old code drew this at py(hi)-2, above y=0)',
          near(ceilNarrow.wall.val, 0.95, 0.01) && /^amp limit 0\.95/.test(ceilNarrow.wall.label) &&
          rectOnCanvas(ceilNarrow.wall.rect),
          'got ' + JSON.stringify(ceilNarrow.wall));
    check('narrow printer: slope cap (1.60) does NOT bind above the wall (0.95) -- no band',
          ceilNarrow.soft === null, 'got ' + JSON.stringify(ceilNarrow.soft));

    // ---- no waves means no slope constraint ----------------------------------
    // slopeAmpCap() must return null (guarded in updateSlope()) rather than
    // dividing by a zero wave count -- both the readout and the soft limit
    // should fall back to "no band", leaving only the hard wall.
    wavesEl.value = '0';
    wavesEl.dispatchEvent(new w.Event('input'));
    wavesEl.dispatchEvent(new w.Event('change'));
    check('0 waves: readout reports ok (no slope to violate)',
          /ok\s*$/.test(slopeReadEl.textContent) && !/TOO STEEP/.test(slopeReadEl.textContent),
          'got ' + JSON.stringify(slopeReadEl.textContent));
    const ceilNoWaves = w.__testAmpCeilings();
    check('0 waves: no soft limit band, hard wall still marks the plain amp limit',
          ceilNoWaves.soft === null && near(ceilNoWaves.wall.val, 0.95, 0.01) &&
          /^amp limit 0\.95/.test(ceilNoWaves.wall.label),
          'got ' + JSON.stringify(ceilNoWaves));

    wavesEl.value = '5';
    wavesEl.dispatchEvent(new w.Event('input'));
    wavesEl.dispatchEvent(new w.Event('change'));

    // ---- degenerate slope caps must never produce bad geometry --------------
    // A slope cap that is a tiny sliver of the axis (a very tight printer +
    // many waves) and a slope cap of exactly 0 (a printer declaring
    // quality_slope_max: 0, i.e. every amplitude is over) are both real
    // configurations a hostile or just unusual printer entry can send. Assert
    // the drawn rect is still finite and on-canvas, and the band never
    // inverts (top must stay above bottom in canvas-Y, i.e. bandTop <
    // bandBottom) rather than merely "did not throw".
    w.__testInjectPrinter({ key: '__test_slope_sliver__', name: 'Test Slope Sliver',
      bed: [235,235], z_amp_max: 4.0, quality_slope_max: 0.10, has_probe: false });
    w.__testSelectPrinter('__test_slope_sliver__');
    wavesEl.value = '20';
    wavesEl.dispatchEvent(new w.Event('input'));
    wavesEl.dispatchEvent(new w.Event('change'));
    const ceilSliver = w.__testAmpCeilings();
    // slope cap = 0.10 * 32 / 20 = 0.16mm on a 4.0mm axis -- the band should
    // cover nearly the whole plot.
    check('tiny slope cap (0.16 on a 4.0 axis): band present, finite, on-canvas, not inverted',
          !!ceilSliver.soft && isFinite(ceilSliver.soft.val) &&
          isFinite(ceilSliver.soft.bandTop) && isFinite(ceilSliver.soft.bandBottom) &&
          ceilSliver.soft.bandTop < ceilSliver.soft.bandBottom &&
          rectOnCanvas(ceilSliver.soft.rect) && rectOnCanvas(ceilSliver.wall.rect),
          'got ' + JSON.stringify(ceilSliver));

    w.__testInjectPrinter({ key: '__test_slope_zero__', name: 'Test Slope Zero',
      bed: [235,235], z_amp_max: 4.0, quality_slope_max: 0, has_probe: false });
    w.__testSelectPrinter('__test_slope_zero__');
    const ceilZero = w.__testAmpCeilings();
    check('quality_slope_max 0: every amplitude is over -- band covers the whole axis, no NaN',
          !!ceilZero.soft && near(ceilZero.soft.val, 0, 1e-6) &&
          isFinite(ceilZero.soft.bandTop) && isFinite(ceilZero.soft.bandBottom) &&
          rectOnCanvas(ceilZero.soft.rect),
          'got ' + JSON.stringify(ceilZero));

    // A slope cap that lands EXACTLY on the wall (equal, not less) must not
    // bind -- draw()/setSoftLimit() both gate on strictly-less, matching
    // updateSlope()'s own `slopeCap < zCap` -- so this is the boundary this
    // codebase already treats as "does not bind" and must keep treating that
    // way (a >= comparison here would flip a valid design into a phantom
    // warning the moment a printer's numbers line up exactly).
    // radius 32 * slope 0.125 / waves 5 = 0.80, chosen to equal z_amp_max 0.80.
    w.__testInjectPrinter({ key: '__test_slope_exact__', name: 'Test Slope Exact',
      bed: [235,235], z_amp_max: 0.80, quality_slope_max: 0.125, has_probe: false });
    w.__testSelectPrinter('__test_slope_exact__');
    wavesEl.value = '5';
    wavesEl.dispatchEvent(new w.Event('input'));
    wavesEl.dispatchEvent(new w.Event('change'));
    const ceilExact = w.__testAmpCeilings();
    check('slope cap exactly equal to z_amp_max: treated as not binding -- no band',
          ceilExact.soft === null, 'got ' + JSON.stringify(ceilExact));

    // ---- every shipped printer profile: /api/printers loop -------------------
    // PRINTER_PROFILES (trident_gcode/profile.py) has 15 entries: z_amp_max
    // ranges 0.95 (Trident) to 4.0 (the five Bambus) with the nine Crealitys
    // <= 1.0, and every shipped profile currently declares the SAME
    // quality_slope_max (0.25) -- see designer.js's SLOPE_LIMIT_FALLBACK
    // comment. Pinned at radius 32 / 5 waves / flat silhouette (still set
    // from above), the slope cap is therefore a FIXED 1.60mm for every one of
    // them, which means this loop exercises both branches for real: the band
    // shows on the five Bambus (1.60 < 4.0) and stays hidden on the Trident
    // and all nine Crealitys (1.60 >= their <= 1.0 ceilings) -- not a
    // hand-picked pair of injected fakes, the actual registry.
    const printerList = await fetch('/api/printers').then(r => r.json()).then(j => j.printers);
    check('printer registry loop actually has printers to iterate (fetch did not silently return empty)',
          Array.isArray(printerList) && printerList.length >= 15,
          'got ' + (printerList && printerList.length));

    const perPrinterFail = [];
    for (const p of printerList) {
      w.__testInjectPrinter(p);
      w.__testSelectPrinter(p.key);
      const c = w.__testAmpCeilings();
      const zCap = typeof p.z_amp_max === 'number' ? p.z_amp_max : 0.4;
      const wantBand = 1.60 < zCap;

      if (!near(c.wall.val, zCap, 0.01)) perPrinterFail.push(p.key + ': wall.val ' + c.wall.val + ' != ' + zCap);
      if (!rectOnCanvas(c.wall.rect)) perPrinterFail.push(p.key + ': wall label off-canvas ' + JSON.stringify(c.wall.rect));
      if (wantBand !== (c.soft !== null)) perPrinterFail.push(p.key + ': band present=' + (c.soft !== null) + ' want=' + wantBand);
      if (c.soft) {
        if (!near(c.soft.val, 1.60, 0.01)) perPrinterFail.push(p.key + ': soft.val ' + c.soft.val + ' != 1.60');
        if (!rectOnCanvas(c.soft.rect)) perPrinterFail.push(p.key + ': soft label off-canvas ' + JSON.stringify(c.soft.rect));
        if (!(c.soft.bandTop < c.soft.bandBottom)) perPrinterFail.push(p.key + ': band inverted ' + c.soft.bandTop + '/' + c.soft.bandBottom);
        // The band's top edge is py(hi) -- the SAME pixel row the hard-wall
        // line is drawn on (PADT=8, designer.js's makeEditor()) on every
        // printer, since hi IS the wall. A drift here would mean the band
        // and the wall had come loose from each other.
        if (!near(c.soft.bandTop, 8, 0.01)) perPrinterFail.push(p.key + ': bandTop ' + c.soft.bandTop + ' != PADT 8');
      }
    }
    check('every printer in /api/printers: hard wall matches z_amp_max, on-canvas, ' +
          'band shown iff the fixed 1.60 slope cap is below it',
          perPrinterFail.length === 0,
          perPrinterFail.join('; '));

    // Leave the page as we found it: restore geometry, curves and printer.
    radiusEl.value = prevRadius;
    radiusEl.dispatchEvent(new w.Event('input'));
    radiusEl.dispatchEvent(new w.Event('change'));
    wavesEl.value = prevWaves;
    wavesEl.dispatchEvent(new w.Event('input'));
    wavesEl.dispatchEvent(new w.Event('change'));
    w.__testSetCurves(prevAmpProfile, prevSilProfile);
    w.__testSelectPrinter(prevPrinterKey);

    // ---- coordinate mirror ---------------------------------------------------
    // The scene is Y-up, the machine Z-up. Swapping two axes without negating
    // one is a REFLECTION (determinant -1), which shows chiral geometry -- an
    // xy_twist, a cage bump -- as its own mirror image. parseGcode therefore
    // maps printer Y to world Z as `cy - y`, and every consumer has to invert
    // it the same way; see the coordinate-mapping note at the top of viewer.js.
    //
    // NOTHING above can see a mirror. Every pick is at Y=117.5 -- dead centre
    // of a 235 mm bed AND the axis of a rotationally symmetric vase -- where a
    // sign flip maps every point onto an identical one. That blind spot is why
    // the mirror survived, so these assertions use asymmetric geometry.

    // A single spur from the bed centre toward the BACK (printer +Y). Nothing
    // exists at the mirror position Y=75, so an un-negated forward transform
    // snaps to the wrong end of the spur and reports back ~117.5.
    const spur = ['M83',
                  'G1 Z0.3 F600',
                  'G1 X117.5 Y117.5 F3000',
                  'G1 X117.5 Y160.0 E1.0 F1200',
                  ''].join('\n');
    await w.loadGcode('mirror_spur.gcode', spur);
    w.document.querySelector('.measure-mode[data-mmode="span"]').click();
    const tip = w.__measureAt(117.5, 160.0, 0.3).points[0];
    check('measure reports printer Y on the side the toolpath is really on',
          near(tip[1], 160.0, 0.6), 'got Y ' + tip[1]);
    check('...without disturbing printer X or Z',
          near(tip[0], 117.5, 0.6) && near(tip[2], 0.3, 0.05), 'got ' + tip.join(', '));

    // Ties world Z to the MACHINE, not merely to itself: a transform flipped
    // consistently in both directions would satisfy the round-trip above but
    // still preview the print mirrored. The front of the bed is printer Y=0,
    // which under `cy - y` is world +Z; the nav cube's Front face pointed at
    // world -Z while the mapping was un-negated, walking the camera round to
    // the back of the machine.
    w.__navCubeClick('front');
    const camY = 235/2 - w.__camera.position.z;      // camera, in printer Y
    const tgtY = 235/2 - w.__controls.target.z;
    check('Front view stands at the low printer-Y edge of the bed',
          camY < tgtY, 'camera Y ' + camY.toFixed(1) + ', target Y ' + tgtY.toFixed(1));

    // Top view has to read the way a slicer draws a bed: the BACK of the
    // machine (printer +Y, i.e. world -Z) at the top of the screen. Which way
    // that lands is set purely by the sign of NAV_EPS in NAV_FACES, and the
    // negation flipped which sign delivers it -- so the un-updated sign showed
    // the bed upside down. Screen-up is derived from the camera rather than
    // read off a pixel: up = (right x forward), right = (forward x camera.up).
    w.__navCubeClick('top');
    const cam = w.__camera, tgt = w.__controls.target;
    const sub = (a, b) => [a.x-b.x, a.y-b.y, a.z-b.z];
    const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
    const fwd = sub(tgt, cam.position);
    const up = [cam.up.x, cam.up.y, cam.up.z];
    const screenUp = cross(cross(fwd, up), fwd);   // (f x up) = right, right x f = up
    check('Top view puts the bed back (printer +Y) at the top of the screen',
          screenUp[2] < 0, 'screen-up world Z ' + screenUp[2].toFixed(3) + ' (want < 0)');

    // Cage handle j must be DRAWN at the bed angle it actually steers.
    // cageScale() puts column j at bed angle 2*pi*j/M, so with M=4 column 1 is
    // theta=90deg -- printer +Y, the back of the bed, hence NEGATIVE world Z.
    // Drawn at +r*sin(theta) the cage is the mirror image of the model it
    // deforms, and dragging the front-left handle bulges the front-right.
    const R = 20, M = 4;
    w.showShapeCage({ rows:2, cols:M, height:10,
                      base:[[R,R,R,R],[R,R,R,R]],
                      scales:[[1,1,1,1],[1,1,1,1]] }, function(){});
    const hs = w.__cageDebug().handles;
    const at = (j) => hs.find(h => h.i === 0 && h.j === j).pos;
    check('cage column 1 (90deg = printer +Y, bed back) sits at negative world Z',
          near(at(1)[0], 0, 0.01) && near(at(1)[2], -R, 0.01), 'got ' + at(1).join(', '));
    check('cage column 3 (270deg = printer -Y, bed front) sits at positive world Z',
          near(at(3)[2], R, 0.01), 'got ' + at(3).join(', '));
    check('cage column 0 (0deg = printer +X) is untouched by the negation',
          near(at(0)[0], R, 0.01) && near(at(0)[2], 0, 0.01), 'got ' + at(0).join(', '));
    // cageScale() is the authority on which column owns which bed angle. If it
    // ever stops agreeing with the placement asserted above, the drawn cage and
    // the deformation it applies have drifted apart.
    const bump = [[1,1,1,1],[1,1.4,1,1]];
    check('cageScale agrees column 1 owns bed angle 90deg',
          near(w.cageScale(bump, Math.PI/2, 1), 1.4, 1e-9),
          'got ' + w.cageScale(bump, Math.PI/2, 1));
    w.hideShapeCage();

    // ---- unsupported-move count must agree with analyze.py -------------------
    // The stats panel's "Unsupported moves" (id s-risk, backed by riskyCount
    // from computeRiskFlags in viewer.js) and trident_gcode/analyze.py's
    // `unsupported_moves` field must report the SAME number for the same
    // file -- the on-screen panel and the printed safety report show both to
    // the user for one print, and a mismatch reads as a contradiction rather
    // than two views of the same thing.
    //
    // This G-code has a supported base-pass square at z=0.3 (below the
    // z=1.0 unsupported-check threshold, so its 4 segments are stored as
    // future support but never themselves checked) and a second square
    // floated in mid-air at z=5.0, 90mm away in XY from the base pass --
    // nothing sits under any of those 4 extruding segments, so all 4 must
    // come back unsupported.
    //
    // 4 is not a prediction: it came from actually running
    // trident_gcode/analyze.py on this exact G-code text (extrude_moves=8,
    // unsupported_moves=4). If the two implementations ever legitimately
    // drift apart, re-run analyze.py on this string and update BOTH this
    // comment and the assertion below -- never just the assertion.
    const unsupportedGcode = [
      'M83',
      'G1 Z0.3 F600',
      'G1 X10 Y10 F3000',
      'G1 X20 Y10 E1.0 F1200',
      'G1 X20 Y20 E1.0 F1200',
      'G1 X10 Y20 E1.0 F1200',
      'G1 X10 Y10 E1.0 F1200',
      'G1 Z5.0 F600',
      'G1 X100 Y100 F3000',
      'G1 X110 Y100 E1.0 F1200',
      'G1 X110 Y110 E1.0 F1200',
      'G1 X100 Y110 E1.0 F1200',
      'G1 X100 Y100 E1.0 F1200',
      ''
    ].join('\n');
    await w.loadGcode('unsupported_check.gcode', unsupportedGcode);
    const unsupportedCount = w.__previewState().riskyCount;
    check('viewer unsupported-move count matches analyze.py (4, from an actual analyze.py run on this G-code)',
          unsupportedCount === 4, 'got ' + unsupportedCount);

    // ---- canvas chrome has to follow the app mode ---------------------------
    // #tl-wrap, #telemetry-card, #tool-rail and #gcode-title all live in
    // #canvas-wrap, OUTSIDE both mode panels, so the panel's own .active class
    // hides none of them -- each has to be told. That has now been got wrong
    // three times (the tool rail, then the telemetry card, then the timeline
    // strip and the filename label), so assert the whole set rather than the
    // piece that broke last. Leaving the strip up is not merely untidy: the
    // scrub bar stays live, so dragging it in Design mode drives playback of a
    // print the canvas is no longer showing.
    var canvasWrap = w.document.getElementById('canvas-wrap');
    var chromeIds = ['tl-wrap', 'telemetry-card', 'tool-rail', 'gcode-title'];
    function modeBtn(m){ return w.document.querySelector('.mode-btn[data-mode="' + m + '"]'); }
    function chromeShown(){
      return chromeIds.filter(function(id){
        var el = w.document.getElementById(id);
        return el && el.style.display !== 'none';
      });
    }

    // Leave the viewer mid-print and mid-playback -- the state that actually
    // leaked. A partially drawn path and a parked nozzle marker are scene
    // objects, not chrome, and they used to be hidden only as a side effect of
    // the blue draft being drawn, which does not happen until the user touches
    // a design control.
    var scrubEl = w.document.getElementById('scrub');
    scrubEl.value = 500;
    scrubEl.dispatchEvent(new w.Event('input', { bubbles: true }));
    var markerWasUp = w.__previewState().nozzleVisible;
    var playBtn = w.document.getElementById('play');
    playBtn.click();
    var playbackStarted = playBtn.textContent === '||';

    modeBtn('design').click();
    var leftOver = chromeShown();
    var staleClearance = !!(canvasWrap && canvasWrap.classList.contains('has-timeline'));
    check('switching back to Design hides every piece of G-code viewer canvas chrome',
          leftOver.length === 0 && !staleClearance,
          'still shown: ' + (leftOver.join(', ') || 'none') +
          (staleClearance ? ' (and .has-timeline still reserving overlay space)' : ''));

    var designFlags = w.__viewFlags();
    var designNozzle = w.__previewState().nozzleVisible;
    check('...and takes the generated toolpath and nozzle marker off the canvas with it',
          designFlags.pathVisible === false && designNozzle === false,
          'pathVisible ' + designFlags.pathVisible + ', nozzle ' + designNozzle +
          (markerWasUp ? '' : ' (marker was already down before the switch)'));

    check('...and stops playback, which would otherwise redraw both next frame',
          playBtn.textContent === '>',
          playbackStarted ? 'play button reads ' + playBtn.textContent
                          : 'playback never started, so this proved nothing');

    modeBtn('viewer').click();
    var missing = chromeIds.filter(function(id){
      var el = w.document.getElementById(id);
      return !el || el.style.display === 'none';
    });
    check('returning to the G-code Viewer brings that chrome back',
          missing.length === 0 &&
          !!(canvasWrap && canvasWrap.classList.contains('has-timeline')),
          'still hidden: ' + (missing.join(', ') || 'none'));

    check('...and puts the toolpath back with it',
          w.__viewFlags().pathVisible === true,
          'pathVisible ' + w.__viewFlags().pathVisible);

    // Hand the suite back in Design mode. loadGcode() above switched to the
    // viewer, and every check below this point reads rows in the design panel
    // -- which is the inactive panel while the viewer is up.
    modeBtn('design').click();

    // ---- Bottom (Open/Solid) must not clobber Base layers --------------------
    // The Bottom radio handler used to do
    // `if (design.bottom === 'open') design.base_layers = 0;`, permanently
    // zeroing the stored Base layers value. Picking Solid again could not
    // bring it back, and the (hidden while Open) #d-base input still showed
    // the old number the whole time -- so the panel promised a solid base
    // while the generate request carried base_layers 0. buildGenerateBody()
    // is the only place Bottom should map to base_layers.
    const baseInput = w.document.getElementById('d-base');
    const bottomRadios = w.document.querySelectorAll('input[name="d-bottom"]');
    const openRadio = w.document.querySelector('input[name="d-bottom"][value="open"]');
    const solidRadio = w.document.querySelector('input[name="d-bottom"][value="solid"]');
    const prevBaseValue = baseInput.value;
    const prevChecked = Array.from(bottomRadios).find(r => r.checked);

    baseInput.value = '2';
    baseInput.dispatchEvent(new w.Event('input'));

    openRadio.checked = true;
    openRadio.dispatchEvent(new w.Event('change'));
    check('Open sends no base layers',
          w.__designSnapshot().base_layers === 0,
          'got ' + w.__designSnapshot().base_layers);

    solidRadio.checked = true;
    solidRadio.dispatchEvent(new w.Event('change'));
    check('switching back to Solid restores the base layers the panel shows',
          w.__designSnapshot().base_layers === 2 && baseInput.value === '2',
          'got base_layers ' + w.__designSnapshot().base_layers + ', #d-base ' + baseInput.value);

    // Leave the page as we found it.
    baseInput.value = prevBaseValue;
    baseInput.dispatchEvent(new w.Event('input'));
    if (prevChecked) {
      prevChecked.checked = true;
      prevChecked.dispatchEvent(new w.Event('change'));
    }

    // ---- Loop fabric hides base/brim/skirt instead of silently dropping them --
    // serve.py's build_loop_fabric() call never forwarded base_layers/
    // brim_loops/skirt_loops/base_style, so the panel kept showing those rows
    // as live controls for a feature (loop fabric anchors itself with its own
    // solid cuff) that never printed any of them. loopFabricActive() now hides
    // the rows and buildGenerateBody() sends 0 for all three -- without ever
    // touching the stored design, so leaving loops brings the user's numbers
    // straight back (same principle as the Bottom radio tested above).
    const patternSelect = w.document.getElementById('d-pattern');
    const prevPattern = patternSelect.value;
    const brimInput = w.document.getElementById('d-brim');
    const skirtInput = w.document.getElementById('d-skirt');
    const prevBrimValue = brimInput.value;
    const prevSkirtValue = skirtInput.value;

    brimInput.value = '1';
    brimInput.dispatchEvent(new w.Event('input'));
    skirtInput.value = '1';
    skirtInput.dispatchEvent(new w.Event('input'));

    patternSelect.value = 'loops';
    patternSelect.dispatchEvent(new w.Event('change'));

    const rowBase = w.document.getElementById('row-base');
    const rowBrim = w.document.getElementById('row-brim');
    const rowSkirt = w.document.getElementById('row-skirt');
    const bottomRow = w.document.getElementById('d-bottom');
    const loopBaseHint = w.document.getElementById('loop-base-hint');
    check('loops hides the Base layers row',
          rowBase.style.display === 'none', 'got ' + rowBase.style.display);
    check('loops hides the Brim loops row',
          rowBrim.style.display === 'none', 'got ' + rowBrim.style.display);
    check('loops hides the Skirt loops row',
          rowSkirt.style.display === 'none', 'got ' + rowSkirt.style.display);
    check('loops hides the Bottom (Open/Solid) row',
          bottomRow.style.display === 'none', 'got ' + bottomRow.style.display);
    check('loops shows the loop-fabric solid-cuff hint',
          loopBaseHint.style.display !== 'none', 'got ' + loopBaseHint.style.display);

    const loopSnap = w.__designSnapshot();
    check('loops sends base_layers/brim/skirt all 0 in the request',
          loopSnap.base_layers === 0 && loopSnap.brim === 0 && loopSnap.skirt === 0,
          'got base_layers ' + loopSnap.base_layers + ', brim ' + loopSnap.brim
            + ', skirt ' + loopSnap.skirt);

    // Leave loops: rows come back, and so does the STORED (non-zero) design --
    // the request-time zeroing above must never have touched it.
    patternSelect.value = prevPattern;
    patternSelect.dispatchEvent(new w.Event('change'));
    check('leaving loops brings the Base layers row back',
          rowBase.style.display !== 'none', 'got ' + rowBase.style.display);
    check('leaving loops brings the Brim loops row back',
          rowBrim.style.display !== 'none', 'got ' + rowBrim.style.display);
    check('leaving loops brings the Skirt loops row back',
          rowSkirt.style.display !== 'none', 'got ' + rowSkirt.style.display);
    const afterSnap = w.__designSnapshot();
    check('leaving loops restores the stored (non-zero) base_layers in the request',
          afterSnap.base_layers !== 0, 'got ' + afterSnap.base_layers);

    brimInput.value = prevBrimValue;
    brimInput.dispatchEvent(new w.Event('input'));
    skirtInput.value = prevSkirtValue;
    skirtInput.dispatchEvent(new w.Event('input'));

    // ---- live draft preview draws the solid base, and lifts the wall --------
    // generatePreview() used to draw ONLY the spiral wall, from z=0 to
    // z=height, no matter what Bottom was set to -- picking Bottom=Solid
    // changed nothing in the draft, and the wall itself sat base_z too low
    // even with no base at all. Calls generatePreview() directly (not through
    // the panel) with a small hand-built design so the assertions don't
    // depend on whatever the panel currently has loaded.
    const previewDesign = {
      shape: 'circle', radius: 20, height: 20, layer_height: 0.3,
      z_waves: 0, squish: 0.75, spacing_factor: 1.25,
      amp_profile: [[0,0],[1,0]], radius_profile: [[0,1],[1,1]],
      base_style: 'spiral', nozzle: 0.4,
      bed_center: [117.5, 117.5]
    };
    const bedCenter = previewDesign.bed_center;
    // generatePreview() returns segment endpoints in PRINTER coordinates
    // offset by the bed centre -- subtract it back out before measuring
    // radii/heights against the design's own numbers.
    function toPrinterXYZ(pts, i) {
      return [pts[i*3] + bedCenter[0], pts[i*3+1], -pts[i*3+2] + bedCenter[1]];
    }
    function minRadiusXY(pts) {
      let m = Infinity;
      for (let i = 0; i < pts.length / 3; i++) {
        const p = toPrinterXYZ(pts, i);
        const r = Math.hypot(p[0] - bedCenter[0], p[2] - bedCenter[1]);
        if (r < m) m = r;
      }
      return m;
    }
    function maxRadiusAtZ(pts, z, tol) {
      let m = 0;
      for (let i = 0; i < pts.length / 3; i++) {
        const p = toPrinterXYZ(pts, i);
        if (Math.abs(p[1] - z) > tol) continue;
        const r = Math.hypot(p[0] - bedCenter[0], p[2] - bedCenter[1]);
        if (r > m) m = r;
      }
      return m;
    }
    function minZ(pts) {
      let m = Infinity;
      for (let i = 0; i < pts.length / 3; i++) {
        const y = toPrinterXYZ(pts, i)[1];
        if (y < m) m = y;
      }
      return m;
    }

    const noBase = w.generatePreview(previewDesign, { base_layers: 0, brim: 0 });
    check('no base: nothing sits near the axis (old behaviour)',
          minRadiusXY(noBase) > 15, 'got min radius ' + minRadiusXY(noBase));

    const withBase = w.generatePreview(previewDesign, { base_layers: 2, brim: 0 });
    check('2 base layers: points reach the axis',
          minRadiusXY(withBase) < 1.0, 'got min radius ' + minRadiusXY(withBase));
    const expectedBaseZ = 0.75 * 0.3;   // squish * layer_height
    check('2 base layers: lowest Z is squish*layer_height',
          near(minZ(withBase), expectedBaseZ, 1e-3),
          'got ' + minZ(withBase) + ', want ' + expectedBaseZ);
    check('2 base layers: base disk max radius is the nominal 20mm outline',
          near(maxRadiusAtZ(withBase, expectedBaseZ, 0.01), 20.0, 0.1),
          'got ' + maxRadiusAtZ(withBase, expectedBaseZ, 0.01));
    // Isolate wall-ish points (near the 20mm outline radius, as opposed to
    // the base disks' inner spiral turns) and confirm none of them sit below
    // base_z -- the old code drew the wall from z=0 unconditionally, which is
    // below base_z (0.225) whenever any adhesion feature is active.
    let minWallZ = Infinity;
    for (let i = 0; i < withBase.length / 3; i++) {
      const p = toPrinterXYZ(withBase, i);
      if (Math.hypot(p[0] - bedCenter[0], p[2] - bedCenter[1]) > 15) {
        if (p[1] < minWallZ) minWallZ = p[1];
      }
    }
    check('2 base layers: the wall is lifted -- no wall point sits below base_z',
          minWallZ >= expectedBaseZ - 1e-3,
          'got min wall-region Z ' + minWallZ + ', want >= ' + expectedBaseZ);

    // ---- base follows the wall's t=0 footprint (radius envelope) ------------
    // Mirrors continuous_spiral.py's _base_t0_footprint(): the base disks must
    // be built from the wall's OWN starting radius, not the raw, un-enveloped
    // outline. A radius_profile of [[0,0.5],[1,1.0]] (wall starts at half
    // radius, flares to full) on radius=20 must base at ~10, not the nominal
    // 20 the flat-silhouette case above uses.
    const narrowingDesign = Object.assign({}, previewDesign, {
      radius_profile: [[0, 0.5], [1, 1.0]]
    });
    const narrowingBase = w.generatePreview(narrowingDesign, { base_layers: 2, brim: 0 });
    check('narrowing radius_profile: base disk max radius follows the wall\'s t=0 radius (~10, not 20)',
          near(maxRadiusAtZ(narrowingBase, expectedBaseZ, 0.01), 10.0, 0.3),
          'got ' + maxRadiusAtZ(narrowingBase, expectedBaseZ, 0.01));

    // ---- how-to-use guide must never auto-open inside this harness ----------
    // The guide auto-opens on a true first visit (no trident-guide-seen key,
    // no stored design, top-level window) -- but this harness runs index.html
    // inside an IFRAME and drives every assertion above by clicking real
    // controls. An auto-opened modal overlay sits on top of the whole page
    // and would silently eat every one of those clicks; the failure would
    // look like unrelated regressions scattered through this file, not "the
    // guide popped up". window.top !== window.self inside the iframe is the
    // guard that keeps it closed -- guide.js must never drop that check.
    var guideModal = w.document.getElementById('guide-modal');
    var guideBtn = w.document.getElementById('guide-btn');
    var guideBack = w.document.getElementById('guide-back');
    var guideNext = w.document.getElementById('guide-next');
    var prevGuideSeen = null, hadPrevGuideSeen = false;
    try {
      prevGuideSeen = w.localStorage.getItem('trident-guide-seen');
      hadPrevGuideSeen = true;
    } catch(e){}

    check('guide did not auto-open inside the dev_smoke iframe',
          !!guideModal && guideModal.style.display === 'none',
          'got display=' + (guideModal && guideModal.style.display));

    guideBtn.click();
    check('clicking the trigger opens the guide',
          guideModal.style.display !== 'none', 'got display=' + guideModal.style.display);

    var slide1 = guideModal.querySelector('.guide-slide[data-slide="0"]');
    var slide2 = guideModal.querySelector('.guide-slide[data-slide="1"]');

    guideNext.click();
    check('Next advances from slide 1 to slide 2',
          slide2.style.display !== 'none' && slide1.style.display === 'none',
          'slide1 ' + slide1.style.display + ', slide2 ' + slide2.style.display);

    guideBack.click();
    check('Back returns from slide 2 to slide 1',
          slide1.style.display !== 'none' && slide2.style.display === 'none',
          'slide1 ' + slide1.style.display + ', slide2 ' + slide2.style.display);

    w.document.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    check('Esc closes the guide',
          guideModal.style.display === 'none', 'got display=' + guideModal.style.display);

    var seenAfterClose = null;
    try { seenAfterClose = w.localStorage.getItem('trident-guide-seen'); } catch(e){}
    check('closing the guide sets trident-guide-seen',
          seenAfterClose === '1', 'got ' + seenAfterClose);

    // Every slide carries a figure -- the guide is meant to SHOW the control
    // being described, not just describe it in prose. A slide that loses its
    // figure silently regresses to a wall of text, which is what this replaced.
    var guideSlides = w.document.querySelectorAll('#guide-modal .guide-slide');
    var slidesWithFig = 0;
    Array.prototype.forEach.call(guideSlides, function(sl){
      if(sl.querySelector('.guide-fig')) slidesWithFig++;
    });
    check('every guide slide has an illustration',
          guideSlides.length > 0 && slidesWithFig === guideSlides.length,
          slidesWithFig + ' of ' + guideSlides.length);

    // Each figure after the first is a RECORDING: a run of frames captured from
    // this app while a real click was driven through it (viewer/guide/README.md).
    // data-count is written by hand next to a directory of files, so the two can
    // drift -- a count that overshoots renders a broken image at the end of the
    // sequence, one that undershoots silently drops the payoff frame. Assert the
    // built stack matches what the slide declares, and that the sequence stayed
    // long enough to actually be a sequence.
    var recFigs = w.document.querySelectorAll('#guide-modal .guide-fig[data-frames]');
    var recOk = 0, recDetail = [];
    Array.prototype.forEach.call(recFigs, function(fig){
      var want = parseInt(fig.getAttribute('data-count'), 10);
      var got = fig.querySelectorAll('img.guide-shot').length;
      if(want >= 2 && got === want) recOk++;
      else recDetail.push(fig.getAttribute('data-frames') + ' want ' + want + ' got ' + got);
    });
    check('every recorded figure built the frames it declares',
          recFigs.length >= 5 && recOk === recFigs.length,
          recFigs.length + ' figures; ' + (recDetail.join('; ') || 'none built'));

    // Playback is a reveal: frame i fades in over frames 0..i-1, which stay
    // lit, so several .gf-on frames at once is CORRECT here (a symmetric
    // crossfade would dip to half brightness mid-step and read as a flicker).
    // What must never happen is a hole in that stack -- a lit frame with an
    // unlit one beneath it is a partially transparent image over whatever the
    // browser last painted, which is exactly the smear the old one-frame rule
    // was guarding against. Assert the lit set is a contiguous prefix.
    var gappy = [];
    Array.prototype.forEach.call(recFigs, function(fig){
      var shots = fig.querySelectorAll('img.guide-shot');
      var seenDark = false, hole = false;
      Array.prototype.forEach.call(shots, function(img){
        if(img.classList.contains('gf-on')){ if(seenDark) hole = true; }
        else seenDark = true;
      });
      if(hole) gappy.push(fig.getAttribute('data-frames'));
    });
    check('every recorded figure lights a contiguous run of frames from the first',
          gappy.length === 0, gappy.join('; '));

    // ONE capture size for the whole guide, stills included. Every frame is
    // stretched to fill the same fixed 16:10 box, so the crop size IS the
    // magnification: a 256-wide crop and a 939-wide crop of the same interface
    // arrive on screen at 1.7x and 0.45x, and paging through the guide reads as
    // the app zooming in and out under the reader. Sizes drift the moment a
    // single sequence is re-shot against a different window, so assert it.
    var allShots = w.document.querySelectorAll('#guide-modal img.guide-shot');
    await Promise.all(Array.prototype.map.call(allShots, function(img){
      if(img.complete) return null;
      return new Promise(function(res){
        img.addEventListener('load', res); img.addEventListener('error', res);
      });
    }));
    var sizes = {}, unloaded = 0;
    Array.prototype.forEach.call(allShots, function(img){
      if(!img.naturalWidth){ unloaded++; return; }
      var k = img.naturalWidth + 'x' + img.naturalHeight;
      sizes[k] = (sizes[k] || 0) + 1;
    });
    var sizeKeys = Object.keys(sizes);
    check('every guide frame is captured at the same pixel size',
          allShots.length >= 20 && unloaded === 0 && sizeKeys.length === 1,
          sizeKeys.map(function(k){ return k + ' x' + sizes[k]; }).join(', ') +
          (unloaded ? ' (' + unloaded + ' failed to load)' : ''));

    // The figures are decoration and must never be the only carrier of meaning:
    // the frames are alt="" and the prose beside them says the same thing.
    // Assert the trigger keeps an accessible name even though it now shows a
    // word rather than a glyph.
    var gBtn = w.document.getElementById('guide-btn');
    check('the guide trigger reads as words and keeps an accessible name',
          /how to use/i.test((gBtn.textContent || '').trim()) &&
          !!(gBtn.getAttribute('aria-label') || '').trim(),
          'text ' + JSON.stringify((gBtn.textContent || '').trim()));

    // Leave the page as we found it.
    try {
      if(hadPrevGuideSeen){
        if(prevGuideSeen === null) w.localStorage.removeItem('trident-guide-seen');
        else w.localStorage.setItem('trident-guide-seen', prevGuideSeen);
      }
    } catch(e){}

    return results;
  }

  frame.addEventListener('load', () => {
    const selftest = params.get('selftest') === '1';
    const src = selftest ? '../examples/01_gentle_wave_vase.gcode' : file;
    status.textContent = 'iframe loaded, fetching ' + src + ' ...';
    fetch(src)
      .then(r => {
        if (!r.ok) throw new Error('fetch failed: ' + r.status + ' ' + r.statusText);
        return r.text();
      })
      .then(async text => {
        const name = src.split('/').pop();
        const w = frame.contentWindow;
        // load() (window.loadGcode) is async -- it stages parse/analysis/build
        // behind requestAnimationFrame yields so a large file's tab shows a
        // progress overlay instead of freezing silently. Await it so nothing
        // below reads viewer state before the load has actually finished.
        await w.loadGcode(name, text);
        if (!selftest) {
          status.textContent = 'loaded ' + name + ' (' + text.length + ' bytes)';
          return;
        }
        const results = await runSelfTest(w);
        const failed = results.filter(r => !r.ok);
        // Reported on the page and to the console, so a headless run can read
        // either one.
        results.forEach(r => console.log((r.ok ? 'PASS  ' : 'FAIL  ') + r.name +
                                         (r.ok ? '' : '  (' + r.detail + ')')));
        console.log(failed.length ? 'MEASURE SELFTEST FAILED' : 'MEASURE SELFTEST ALL PASS');
        status.style.color = failed.length ? '#ff5d5d' : '#3fdca0';
        status.style.whiteSpace = 'pre';
        status.textContent = results.map(r => (r.ok ? 'PASS  ' : 'FAIL  ') + r.name +
                                              (r.ok ? '' : '  (' + r.detail + ')')).join('\n') +
                             '\n' + (failed.length ? failed.length + ' FAILED' : 'ALL PASS');
        window.__measureSelfTest = { results, failed: failed.length };
      })
      .catch(err => {
        status.textContent = 'ERROR: ' + err.message;
        status.style.color = '#ff5d5d';
      });
  });
</script>
</body>
</html>
